name: Download, Artifact & Release

# ──────────────────────────────────────────────────────────────────────────────
# Secrets used (configure in repo/org Settings → Secrets → Actions):
#   DISCORD_WEBHOOK      — Discord incoming webhook URL
#   SLACK_WEBHOOK        — Slack incoming webhook URL
#   TELEGRAM_BOT_TOKEN   — Telegram bot token
#   VIRUSTOTAL_API_KEY   — VirusTotal API key (free tier: 4 req/min)
#
# Triggers: manual workflow_dispatch  OR  reusable workflow_call
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      # ── Required ───────────────────────────────────────────────────────────
      download_url:
        description: "Direct download URL(s) — comma-separated for multiple files"
        required: true
        type: string

      # ── Release ────────────────────────────────────────────────────────────
      release_tag:
        description: "Release tag (e.g. v1.0.0) — leave blank to auto-generate from date/time"
        required: false
        type: string
      release_name:
        description: "Release title (optional, defaults to tag)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release?"
        required: false
        type: boolean
        default: false
      draft:
        description: "Save as draft release (publish manually later)?"
        required: false
        type: boolean
        default: false
      append_to_existing:
        description: "If tag already exists, append files to that release instead of failing?"
        required: false
        type: boolean
        default: false

      # ── Integrity & safety ─────────────────────────────────────────────────
      expected_sha256:
        description: "Expected SHA-256 hash — verified against first file (optional)"
        required: false
        type: string
      max_size_mb:
        description: "Reject if file exceeds this size in MB, supports decimals e.g. 1.5 (0 = no limit)"
        required: false
        type: number
        default: 0
      allowed_mimes:
        description: "Comma-separated MIME allowlist e.g. application/zip,application/vnd.android.package-archive (blank = allow all)"
        required: false
        type: string

      # ── Download ───────────────────────────────────────────────────────────
      file_rename:
        description: "Override saved filename — only applies when a single URL is given"
        required: false
        type: string
      download_timeout_minutes:
        description: "Max minutes before download is aborted (0 = no limit)"
        required: false
        type: number
        default: 60
      basic_auth:
        description: "HTTP Basic Auth credentials as username:password (optional)"
        required: false
        type: string

      # ── Artifact ───────────────────────────────────────────────────────────
      artifact_retention_days:
        description: "Actions artifact retention in days (1–90)"
        required: false
        type: number
        default: 90
      delete_artifact_after_release:
        description: "Delete the Actions artifact after the release is created?"
        required: false
        type: boolean
        default: false

      # ── Notifications ──────────────────────────────────────────────────────
      telegram_chat_id:
        description: "Telegram chat ID to notify (requires TELEGRAM_BOT_TOKEN secret)"
        required: false
        type: string

      # ── Misc ───────────────────────────────────────────────────────────────
      dry_run:
        description: "Dry run — download and validate only, skip artifact upload and release"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      download_url:
        required: true
        type: string
      release_tag:
        required: false
        type: string
      release_name:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      draft:
        required: false
        type: boolean
        default: false
      append_to_existing:
        required: false
        type: boolean
        default: false
      expected_sha256:
        required: false
        type: string
      max_size_mb:
        required: false
        type: number
        default: 0
      allowed_mimes:
        required: false
        type: string
      file_rename:
        required: false
        type: string
      download_timeout_minutes:
        required: false
        type: number
        default: 60
      basic_auth:
        required: false
        type: string
      artifact_retention_days:
        required: false
        type: number
        default: 90
      delete_artifact_after_release:
        required: false
        type: boolean
        default: false
      telegram_chat_id:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK:
        required: false
      SLACK_WEBHOOK:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
    outputs:
      release_url:
        description: "URL of the created GitHub Release"
        value: ${{ jobs.download-and-release.outputs.release_url }}
      release_tag:
        description: "Tag used for the release"
        value: ${{ jobs.download-and-release.outputs.release_tag }}

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      release_url: ${{ steps.release.outputs.url }}
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      # ── 1. Validate inputs ───────────────────────────────────────────────────
      - name: Validate inputs
        run: |
          ERRORS=0

          RETENTION="${{ inputs.artifact_retention_days }}"
          if [ -n "$RETENTION" ] && { [ "$RETENTION" -lt 1 ] 2>/dev/null || [ "$RETENTION" -gt 90 ] 2>/dev/null; }; then
            echo "::error::artifact_retention_days must be 1–90. Got: $RETENTION"
            ERRORS=$((ERRORS+1))
          fi

          MAX="${{ inputs.max_size_mb }}"
          if [ -n "$MAX" ] && ! [[ "$MAX" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::max_size_mb must be a non-negative number. Got: $MAX"
            ERRORS=$((ERRORS+1))
          fi

          TIMEOUT="${{ inputs.download_timeout_minutes }}"
          if [ -n "$TIMEOUT" ] && ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "::error::download_timeout_minutes must be a non-negative integer. Got: $TIMEOUT"
            ERRORS=$((ERRORS+1))
          fi

          TG_CHAT="${{ inputs.telegram_chat_id }}"
          TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          if [ -n "$TG_CHAT" ] && [ -z "$TG_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is required when telegram_chat_id is set."
            ERRORS=$((ERRORS+1))
          fi

          BASIC_AUTH="${{ inputs.basic_auth }}"
          if [ -n "$BASIC_AUTH" ] && ! echo "$BASIC_AUTH" | grep -q ':'; then
            echo "::error::basic_auth must be in username:password format."
            ERRORS=$((ERRORS+1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS validation error(s). Aborting."
            exit 1
          fi

          echo "Input validation passed."

      # ── 2. Map secrets to $GITHUB_ENV flags ──────────────────────────────────
      - name: Check available secrets
        run: |
          [ -n "${{ secrets.DISCORD_WEBHOOK }}"    ] && echo "HAS_DISCORD=true"  >> "$GITHUB_ENV" || true
          [ -n "${{ secrets.SLACK_WEBHOOK }}"      ] && echo "HAS_SLACK=true"    >> "$GITHUB_ENV" || true
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "HAS_TELEGRAM=true" >> "$GITHUB_ENV" || true
          [ -n "${{ secrets.VIRUSTOTAL_API_KEY }}" ] && echo "HAS_VT=true"       >> "$GITHUB_ENV" || true

      # ── 3a. Get today's date (ClamAV cache key) ─────────────────────────────
      - name: Get today's date (for ClamAV cache key)
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ── 3b. Cache ClamAV virus definitions ───────────────────────────────────
      - name: Cache ClamAV definitions
        id: clamav-cache
        uses: actions/cache@v4
        with:
          path: ~/.clamav_db_cache
          key: clamav-definitions-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-definitions-${{ runner.os }}-

      # ── 3c. Install tools ────────────────────────────────────────────────────
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 clamav clamav-daemon gnupg bc

          sudo systemctl stop clamav-freshclam || true

          if [ -d "$HOME/.clamav_db_cache" ] && [ "$(ls -A "$HOME/.clamav_db_cache")" ]; then
            echo "Restoring ClamAV definitions from cache..."
            sudo cp -r "$HOME"/.clamav_db_cache/* /var/lib/clamav/
            sudo chown -R clamav:clamav /var/lib/clamav
          fi

          if [ "${{ steps.clamav-cache.outputs.cache-hit }}" != "true" ]; then
            echo "ClamAV cache miss — running freshclam..."
            sudo freshclam --quiet || echo "::warning::ClamAV signature update failed — using existing definitions."

            mkdir -p "$HOME/.clamav_db_cache"
            sudo cp -r /var/lib/clamav/* "$HOME/.clamav_db_cache/"
            sudo chown -R "$USER":"$USER" "$HOME/.clamav_db_cache"
            echo "ClamAV definitions saved to cache."
          else
            echo "ClamAV definitions restored from cache — skipping freshclam."
          fi

      # ── 4. Parse and validate URLs ───────────────────────────────────────────
      - name: Parse and validate URLs
        id: urls
        run: |
          RAW="${{ inputs.download_url }}"
          BASIC_AUTH="${{ inputs.basic_auth }}"

          CURL_AUTH=()
          [ -n "$BASIC_AUTH" ] && CURL_AUTH=("--user" "$BASIC_AUTH")

          IFS=',' read -ra URL_ARRAY <<< "$RAW"
          COUNT=0

          for URL in "${URL_ARRAY[@]}"; do
            URL=$(echo "$URL" | xargs)

            if [[ ! "$URL" =~ ^https?:// ]]; then
              echo "::error::URL must start with http:// or https://. Got: $URL"
              exit 1
            fi

            if [[ "$URL" =~ ^http:// ]]; then
              echo "::warning::URL uses plain HTTP (unencrypted): $URL"
            fi

            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 15 --location \
              -H "Range: bytes=0-0" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              "${CURL_AUTH[@]}" \
              "$URL")

            if [ "$HTTP_CODE" -lt 200 ] || \
               { [ "$HTTP_CODE" -ge 400 ] && [ "$HTTP_CODE" != "206" ]; }; then
              echo "::error::Pre-flight check failed (HTTP $HTTP_CODE) for: $URL"
              exit 1
            fi

            COUNT=$((COUNT+1))
            printf '%s\n' "$URL" >> /tmp/urls.txt
            echo "Pre-flight passed (HTTP $HTTP_CODE): $URL"
          done

          echo "url_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT URL(s) validated."

      # ── 5. Resolve filenames and detect source types ──────────────────────────
      - name: Resolve filenames and detect source types
        id: resolve
        run: |
          FILE_RENAME="${{ inputs.file_rename }}"
          BASIC_AUTH="${{ inputs.basic_auth }}"
          URL_COUNT="${{ steps.urls.outputs.url_count }}"

          CURL_AUTH=()
          [ -n "$BASIC_AUTH" ] && CURL_AUTH=("--user" "$BASIC_AUTH")

          IDX=0
          while IFS= read -r URL; do
            IDX=$((IDX+1))
            SOURCE_TYPE="generic"
            GDRIVE_ID=""

            if echo "$URL" | grep -qE "drive\.google\.com/(file/d/|open\?id=)"; then
              SOURCE_TYPE="gdrive"
              GDRIVE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+' | head -1)
              echo "[$IDX] Google Drive. ID: $GDRIVE_ID"
            elif echo "$URL" | grep -qE "sourceforge\.net"; then
              SOURCE_TYPE="sourceforge"
              echo "[$IDX] SourceForge detected."
            elif echo "$URL" | grep -qiE "\.torrent(\?.*)?$"; then
              SOURCE_TYPE="torrent"
              echo "[$IDX] .torrent file URL detected."
            fi

            if [ -n "$FILE_RENAME" ] && [ "$URL_COUNT" = "1" ]; then
              FILENAME="$FILE_RENAME"
              echo "[$IDX] Using user-provided filename: $FILENAME"
            else
              HEADERS=$(curl -s -D- -o /dev/null --location --max-time 15 \
                         -H "Range: bytes=0-0" \
                         -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                         "${CURL_AUTH[@]}" "$URL" 2>/dev/null \
                       || curl -s -D- -o /dev/null --location --max-time 15 \
                         -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                         "${CURL_AUTH[@]}" "$URL" 2>/dev/null)

              FILENAME=$(echo "$HEADERS" \
                | grep -i 'content-disposition' \
                | sed -n 's/.*filename[^;=\n]*=\s*["\x27]\?\([^"\x27;\r\n]*\).*/\1/Ip' \
                | tr -d '\r')

              if [ -z "$FILENAME" ]; then
                FILENAME=$(echo "$HEADERS" \
                  | grep -i 'content-disposition' \
                  | sed -n "s/.*filename\*=[Uu][Tt][Ff]-8''\([^;\r\n]*\).*/\1/Ip" \
                  | python3 -c "import sys,urllib.parse; \
                      print(urllib.parse.unquote(sys.stdin.read().strip()))" \
                  | tr -d '\r')
              fi

              if [ -z "$FILENAME" ]; then
                FILENAME=$(basename "$(echo "$URL" | cut -d'?' -f1)")
              fi

              FILENAME="${FILENAME:-downloaded_file_${IDX}}"
            fi

            ORIGINAL="$FILENAME"
            FILENAME=$(echo "$FILENAME" | sed 's/[:<>"\\/|?* ]/_/g' | tr -s '_')
            if [ "$FILENAME" != "$ORIGINAL" ]; then
              echo "::warning::[$IDX] Filename sanitized: '$ORIGINAL' → '$FILENAME'"
            fi

            echo "$SOURCE_TYPE" > "/tmp/source_type_${IDX}.txt"
            echo "$GDRIVE_ID"   > "/tmp/gdrive_id_${IDX}.txt"
            printf '%s\n' "$FILENAME" >> /tmp/filenames.txt
            echo "[$IDX] Filename: $FILENAME | Source: $SOURCE_TYPE"

          done < /tmp/urls.txt

      # ── 6. Download all files ────────────────────────────────────────────────
      - name: Download files
        id: download
        run: |
          BASIC_AUTH="${{ inputs.basic_auth }}"
          TIMEOUT_MIN="${{ inputs.download_timeout_minutes }}"

          # Fix: Initialise TIMEOUT_SEC to 0 first, then only set it when
          # TIMEOUT_MIN is a positive integer — prevents aria2c receiving
          # --timeout=0, which it rejects with errorCode=28.
          TIMEOUT_SEC=0
          if [ -n "$TIMEOUT_MIN" ] && [ "$TIMEOUT_MIN" -gt 0 ] 2>/dev/null; then
            TIMEOUT_SEC=$((TIMEOUT_MIN * 60))
          fi

          CURL_AUTH=()
          ARIA_AUTH=()
          if [ -n "$BASIC_AUTH" ]; then
            CURL_AUTH=("--user" "$BASIC_AUTH")
            ARIA_USER=$(echo "$BASIC_AUTH" | cut -d: -f1)
            ARIA_PASS=$(echo "$BASIC_AUTH" | cut -d: -f2-)
            ARIA_AUTH=("--http-user=${ARIA_USER}" "--http-passwd=${ARIA_PASS}")
          fi

          CURL_TIMEOUT=()
          ARIA_TIMEOUT=()
          if [ "$TIMEOUT_SEC" -gt 0 ]; then
            CURL_TIMEOUT=("--max-time" "${TIMEOUT_SEC}")
            ARIA_TIMEOUT=("--timeout=${TIMEOUT_SEC}")
          fi

          IDX=0
          while IFS= read -r URL; do
            IDX=$((IDX+1))
            SOURCE_TYPE=$(cat "/tmp/source_type_${IDX}.txt")
            GDRIVE_ID=$(cat "/tmp/gdrive_id_${IDX}.txt")
            FILENAME=$(sed -n "${IDX}p" /tmp/filenames.txt)

            echo "=== [$IDX] Downloading: $FILENAME ==="
            START_NS=$(date +%s%N)

            if [ "$SOURCE_TYPE" = "torrent" ]; then
              echo "Fetching .torrent descriptor..."
              curl -L --fail --retry 3 \
                   "${CURL_TIMEOUT[@]}" "${CURL_AUTH[@]}" \
                   -o "/tmp/file_${IDX}.torrent" "$URL"

              echo "Fetching torrent content (seed-time=0)..."
              mkdir -p "/tmp/torrent_dl_${IDX}"
              aria2c \
                --dir="/tmp/torrent_dl_${IDX}" \
                --seed-time=0 \
                --max-tries=5 \
                "${ARIA_AUTH[@]}" \
                "/tmp/file_${IDX}.torrent"

              FILE_COUNT=$(find "/tmp/torrent_dl_${IDX}" -maxdepth 5 -type f | wc -l)
              echo "[$IDX] Torrent downloaded $FILE_COUNT file(s)."

              if [ "$FILE_COUNT" -eq 1 ]; then
                DL_FILE=$(find "/tmp/torrent_dl_${IDX}" -maxdepth 5 -type f | head -1)
                # Fix 1C: Use the filename aria2c actually produced (e.g. ubuntu.iso)
                # rather than the descriptor URL name (e.g. ubuntu.iso.torrent).
                # Apply the same sanitization as Step 5 — the torrent payload name
                # may contain spaces or special chars (e.g. "Ubuntu 22.04.iso") that
                # would crash `source /tmp/meta_N.env` in Step 7 (bash would try to
                # execute "22.04.iso" as a command). Sanitize before mv and filenames.txt.
                ACTUAL_NAME=$(basename "$DL_FILE")
                SANITIZED_NAME=$(echo "$ACTUAL_NAME" | sed 's/[:<>"\\/|?* ]/_/g' | tr -s '_')
                if [ "$SANITIZED_NAME" != "$ACTUAL_NAME" ]; then
                  echo "::warning::[$IDX] Torrent payload filename sanitized: '$ACTUAL_NAME' → '$SANITIZED_NAME'"
                fi
                mv "$DL_FILE" "./$SANITIZED_NAME"
                FILENAME="$SANITIZED_NAME"
                awk -v line="$IDX" -v val="$SANITIZED_NAME" \
                  'NR==line{$0=val}1' /tmp/filenames.txt > /tmp/fn_tmp.txt \
                  && mv /tmp/fn_tmp.txt /tmp/filenames.txt
                echo "[$IDX] Single-file torrent moved to: $SANITIZED_NAME"
              elif [ "$FILE_COUNT" -gt 1 ]; then
                ZIP_NAME="${FILENAME%.torrent}.zip"
                ZIP_NAME="${ZIP_NAME:-torrent_${IDX}.zip}"
                echo "::warning::[$IDX] Multi-file torrent ($FILE_COUNT files) — packaging as $ZIP_NAME"
                (cd "/tmp/torrent_dl_${IDX}" && zip -r - .) > "./$ZIP_NAME"
                FILENAME="$ZIP_NAME"
                awk -v line="$IDX" -v val="$FILENAME" 'NR==line{$0=val}1' /tmp/filenames.txt > /tmp/fn_tmp.txt && mv /tmp/fn_tmp.txt /tmp/filenames.txt
                echo "[$IDX] Multi-file torrent zipped to: $FILENAME"
              else
                echo "::error::[$IDX] Torrent download produced no files."
                exit 1
              fi

            elif [ "$SOURCE_TYPE" = "gdrive" ]; then
              CONFIRM=$(curl -sc /tmp/gdrive_cookies.txt \
                "${CURL_TIMEOUT[@]}" \
                "https://drive.google.com/uc?export=download&id=${GDRIVE_ID}" \
                | grep -o 'confirm=[^&"]*' | head -1 | cut -d= -f2)
              if [ -n "$CONFIRM" ]; then
                curl -Lb /tmp/gdrive_cookies.txt \
                     "${CURL_TIMEOUT[@]}" \
                  "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${GDRIVE_ID}" \
                  -o "./$FILENAME"
              else
                curl -L "${CURL_TIMEOUT[@]}" \
                  "https://drive.google.com/uc?export=download&id=${GDRIVE_ID}" \
                  -o "./$FILENAME"
              fi

            elif [ "$SOURCE_TYPE" = "sourceforge" ]; then
              curl -L --fail --retry 5 --retry-delay 10 \
                   --location-trusted \
                   -b /tmp/cookies.txt -c /tmp/cookies.txt \
                   -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                   "${CURL_TIMEOUT[@]}" "${CURL_AUTH[@]}" \
                   -o "./$FILENAME" "$URL"

            else
              aria2c \
                --split=8 \
                --max-connection-per-server=8 \
                --min-split-size=5M \
                --max-tries=5 \
                --retry-wait=5 \
                --allow-overwrite=true \
                --auto-file-renaming=false \
                --continue=true \
                "${ARIA_TIMEOUT[@]}" "${ARIA_AUTH[@]}" \
                --out="$FILENAME" "$URL" \
              || {
                echo "::warning::aria2c failed — falling back to curl with resume support."
                curl -L --fail --retry 3 --retry-delay 5 \
                     --location-trusted \
                     --continue-at - \
                     -b /tmp/cookies.txt -c /tmp/cookies.txt \
                     -A "Mozilla/5.0 (compatible; GitHub-Actions-Downloader/1.0)" \
                     "${CURL_TIMEOUT[@]}" "${CURL_AUTH[@]}" \
                     -o "./$FILENAME" "$URL"
              }
            fi

            END_NS=$(date +%s%N)
            DURATION_SEC=$(echo "scale=2; $((END_NS - START_NS)) / 1000000 / 1000" | bc)
            echo "$DURATION_SEC" > "/tmp/duration_${IDX}.txt"

            DETECTED_MIME=$(file --mime-type -b "./$FILENAME")
            ALLOWED_MIMES="${{ inputs.allowed_mimes }}"
            HTML_ALLOWED=false
            IFS=',' read -ra MLIST <<< "$ALLOWED_MIMES"
            for M in "${MLIST[@]}"; do
              [ "$(echo "$M" | tr -d ' ')" = "text/html" ] && HTML_ALLOWED=true && break
            done

            if [[ "$DETECTED_MIME" == "text/html" ]] && [ "$HTML_ALLOWED" = "false" ]; then
              echo "::error::[$IDX] Downloaded file is an HTML page. URL may need auth, use a landing page, or has expired."
              echo "--- First 500 bytes ---"
              head -c 500 "./$FILENAME"
              exit 1
            fi

            echo "[$IDX] Complete: $FILENAME in ${DURATION_SEC}s"
          done < /tmp/urls.txt

      # ── 7. Compute metadata ───────────────────────────────────────────────────
      - name: Compute metadata
        id: meta
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IDX=0

          while IFS= read -r URL; do
            IDX=$((IDX+1))
            FILENAME=$(sed -n "${IDX}p" /tmp/filenames.txt)
            DURATION=$(cat "/tmp/duration_${IDX}.txt")

            SIZE_BYTES=$(stat -c%s "./$FILENAME")
            SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE_BYTES")
            MD5=$(md5sum       "./$FILENAME" | awk '{print $1}')
            SHA1=$(sha1sum     "./$FILENAME" | awk '{print $1}')
            SHA256=$(sha256sum "./$FILENAME" | awk '{print $1}')
            SHA512=$(sha512sum "./$FILENAME" | awk '{print $1}')
            MIME=$(file --mime-type -b "./$FILENAME")

            if (( $(echo "$DURATION > 0" | bc -l) )); then
              SPEED_BPS=$(echo "scale=0; $SIZE_BYTES / $DURATION" | bc)
              SPEED_HUMAN=$(numfmt --to=iec-i --suffix=B/s "$SPEED_BPS")
            else
              SPEED_HUMAN="N/A"
            fi

            cat > "/tmp/meta_${IDX}.env" <<EOF
          FILENAME="$FILENAME"
          SIZE_BYTES="$SIZE_BYTES"
          SIZE_HUMAN="$SIZE_HUMAN"
          MD5="$MD5"
          SHA1="$SHA1"
          SHA256="$SHA256"
          SHA512="$SHA512"
          MIME="$MIME"
          SPEED_HUMAN="$SPEED_HUMAN"
          DURATION="$DURATION"
          EOF

            printf -- "--- File %d ---\n" "$IDX"
            printf "  %-10s %s\n"            "File:"    "$FILENAME"
            printf "  %-10s %s\n"            "MIME:"    "$MIME"
            printf "  %-10s %s (%s bytes)\n" "Size:"    "$SIZE_HUMAN" "$SIZE_BYTES"
            printf "  %-10s %s\n"            "Speed:"   "$SPEED_HUMAN"
            printf "  %-10s %s\n"            "MD5:"     "$MD5"
            printf "  %-10s %s\n"            "SHA-1:"   "$SHA1"
            printf "  %-10s %s\n"            "SHA-256:" "$SHA256"
            printf "  %-10s %s\n"            "SHA-512:" "$SHA512"

          done < /tmp/urls.txt

          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL"     >> "$GITHUB_OUTPUT"

      # ── 8. File size and MIME type checks ─────────────────────────────────────
      - name: Check file size and MIME type
        run: |
          MAX_MB="${{ inputs.max_size_mb }}"
          ALLOWED="${{ inputs.allowed_mimes }}"
          IDX=0

          while IFS= read -r URL; do
            IDX=$((IDX+1))
            source "/tmp/meta_${IDX}.env"

            if [ -n "$MAX_MB" ] && [ "$MAX_MB" != "0" ]; then
              MAX_BYTES=$(echo "$MAX_MB * 1048576 / 1" | bc)
              if (( SIZE_BYTES > MAX_BYTES )); then
                echo "::error::[$IDX] $FILENAME: size ($SIZE_HUMAN) exceeds limit of ${MAX_MB} MB."
                exit 1
              fi
              echo "[$IDX] Size OK: $SIZE_HUMAN ≤ ${MAX_MB} MB"
            fi

            if [ -n "$ALLOWED" ]; then
              MATCH=false
              IFS=',' read -ra MLIST <<< "$ALLOWED"
              for M in "${MLIST[@]}"; do
                [ "$(echo "$M" | tr -d ' ')" = "$MIME" ] && MATCH=true && break
              done
              if [ "$MATCH" = "false" ]; then
                echo "::error::[$IDX] $FILENAME: MIME '$MIME' not in allowlist: $ALLOWED"
                exit 1
              fi
              echo "[$IDX] MIME OK: '$MIME' is allowed"
            fi

          done < /tmp/urls.txt

      # ── 9. SHA-256 integrity check ────────────────────────────────────────────
      - name: Verify SHA-256 integrity
        run: |
          EXP="${{ inputs.expected_sha256 }}"
          [ -z "$EXP" ] && echo "No expected hash — skipping." && exit 0

          URL_COUNT=$(wc -l < /tmp/urls.txt)
          if [ "$URL_COUNT" -gt 1 ]; then
            echo "::error::expected_sha256 can only be used with a single URL. Got $URL_COUNT URLs."
            exit 1
          fi

          source "/tmp/meta_1.env"
          EXPECTED=$(echo "$EXP"    | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(echo   "$SHA256" | tr '[:upper:]' '[:lower:]')

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::SHA-256 check FAILED for $FILENAME"
            echo "  Expected : $EXPECTED"
            echo "  Actual   : $ACTUAL"
            cat >> "$GITHUB_STEP_SUMMARY" <<SUMEOF

          ## ❌ SHA-256 Integrity Check FAILED

          | | Hash |
          |---|---|
          | **Expected** | \`$EXPECTED\` |
          | **Actual**   | \`$ACTUAL\` |

          The file does not match the expected SHA-256. Release was **not** created.
          SUMEOF
            exit 1
          fi

          echo "SHA-256 check PASSED."

      # ── 10. ClamAV virus scan ─────────────────────────────────────────────────
      - name: ClamAV virus scan
        id: clamav
        run: |
          IDX=0
          SUMMARY=""

          while IFS= read -r URL; do
            IDX=$((IDX+1))
            FILENAME=$(sed -n "${IDX}p" /tmp/filenames.txt)
            OUT=$(clamscan --no-summary "./$FILENAME" 2>&1 || true)

            if echo "$OUT" | grep -q "FOUND"; then
              DETAIL=$(echo "$OUT" | grep "FOUND")
              echo "::warning::[$IDX] Threat in $FILENAME: $DETAIL"
              SUMMARY="${SUMMARY}[$IDX] ⚠️ ${DETAIL} | "
            else
              SUMMARY="${SUMMARY}[$IDX] ✅ Clean | "
            fi
          done < /tmp/urls.txt

          echo "scan_summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "ClamAV: $SUMMARY"

      # ── 11. VirusTotal hash lookup ────────────────────────────────────────────
      - name: VirusTotal hash lookup
        id: vt
        if: ${{ env.HAS_VT == 'true' }}
        run: |
          IDX=0
          SUMMARY=""
          FIRST=true

          while IFS= read -r URL; do
            IDX=$((IDX+1))
            source "/tmp/meta_${IDX}.env"

            if [ "$FIRST" = "false" ]; then
              echo "Sleeping 16s for VirusTotal rate limit..."
              sleep 16
            fi
            FIRST=false

            RESPONSE=$(curl -s --max-time 20 \
              --request GET \
              --url "https://www.virustotal.com/api/v3/files/${SHA256}" \
              --header "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}")

            RESULT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            if 'error' in d:
                code = d['error'].get('code','')
                if code == 'NotFoundError':
                    print('— Not found (file may be new/unknown)')
                elif code == 'QuotaExceededError':
                    print('::warning::VirusTotal quota exceeded — results unavailable for this run. Consider upgrading your API plan.')
                else:
                    print(f'— VT error: {code}')
            else:
                stats = d['data']['attributes']['last_analysis_stats']
                mal  = stats.get('malicious', 0)
                sus  = stats.get('suspicious', 0)
                tot  = sum(stats.values())
                fid  = d['data']['id']
                link = f'https://www.virustotal.com/gui/file/{fid}'
                flag = '⚠️' if (mal > 0 or sus > 0) else '✅'
                print(f'{flag} {mal} malicious / {sus} suspicious of {tot} — {link}')
          except Exception as e:
            print(f'— VT parse error: {e}')
          " 2>/dev/null || echo "— VT lookup failed")

            echo "[$IDX] $FILENAME: $RESULT"
            printf '%s\n' "$RESULT" > "/tmp/vt_${IDX}.txt"
            SUMMARY="${SUMMARY}[$IDX] ${RESULT} | "

          done < /tmp/urls.txt

          echo "vt_summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      # ── 12. Generate checksums.txt ────────────────────────────────────────────
      - name: Generate checksums.txt
        run: |
          {
            echo "# Checksums generated : ${{ steps.meta.outputs.timestamp }}"
            echo "# Workflow run        : ${{ steps.meta.outputs.run_url }}"
            echo ""
          } > checksums.txt

          IDX=0
          while IFS= read -r URL; do
            IDX=$((IDX+1))
            source "/tmp/meta_${IDX}.env"
            {
              echo "# File $IDX : $FILENAME"
              echo "# Source    : $URL"
              echo "MD5    ($FILENAME) = $MD5"
              echo "SHA1   ($FILENAME) = $SHA1"
              echo "SHA256 ($FILENAME) = $SHA256"
              echo "SHA512 ($FILENAME) = $SHA512"
              echo ""
              echo "# sha256sum-compatible (verify with: sha256sum -c checksums.txt)"
              echo "$SHA256  $FILENAME"
              echo ""
            } >> checksums.txt
          done < /tmp/urls.txt

          echo "checksums.txt generated."

      # ── 13. Generate metadata.json ────────────────────────────────────────────
      - name: Generate metadata.json
        run: |
          python3 - <<'PYEOF'
          import json, os

          urls   = open('/tmp/urls.txt').read().strip().splitlines()
          fnames = open('/tmp/filenames.txt').read().strip().splitlines()
          files  = []

          for idx, (url, fname) in enumerate(zip(urls, fnames), 1):
              env = {}
              for line in open(f'/tmp/meta_{idx}.env').read().strip().splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      env[k] = v

              vt_path = f'/tmp/vt_{idx}.txt'
              vt = open(vt_path).read().strip() if os.path.exists(vt_path) else None

              files.append({
                  "index":          idx,
                  "filename":       fname,
                  "source_url":     url,
                  "source_type":    open(f'/tmp/source_type_{idx}.txt').read().strip(),
                  "mime_type":      env.get("MIME"),
                  "size":           {"bytes": int(env.get("SIZE_BYTES", 0)),
                                     "human": env.get("SIZE_HUMAN")},
                  "download_speed": env.get("SPEED_HUMAN"),
                  "duration_sec":   float(env.get("DURATION", 0)),
                  "checksums":      {"md5":    env.get("MD5"),
                                     "sha1":   env.get("SHA1"),
                                     "sha256": env.get("SHA256"),
                                     "sha512": env.get("SHA512")},
                  "virustotal":     vt
              })

          output = {
              "generated_at": os.environ["TIMESTAMP"],
              "workflow": {
                  "run_url":    os.environ["RUN_URL"],
                  "repository": os.environ["REPO"],
                  "run_id":     os.environ["RUN_ID"],
                  "actor":      os.environ["ACTOR"]
              },
              "integrity": {
                  "expected_sha256": os.environ.get("EXP_SHA256") or None,
                  "clamav":          os.environ.get("CLAMAV_SUMMARY")
              },
              "files": files
          }

          with open("metadata.json", "w") as f:
              json.dump(output, f, indent=2)
          print("metadata.json written.")
          PYEOF
        env:
          TIMESTAMP:      ${{ steps.meta.outputs.timestamp }}
          RUN_URL:        ${{ steps.meta.outputs.run_url }}
          REPO:           ${{ github.repository }}
          RUN_ID:         ${{ github.run_id }}
          ACTOR:          ${{ github.actor }}
          EXP_SHA256:     ${{ inputs.expected_sha256 }}
          CLAMAV_SUMMARY: ${{ steps.clamav.outputs.scan_summary }}

      # ── 14. Resolve release tag ───────────────────────────────────────────────
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="dl-$(date -u +%Y%m%d-%H%M%S)"
            echo "Auto-generated tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ── 15. Stage release files ───────────────────────────────────────────────
      # FIX: Before staging, check every downloaded file against GitHub's hard
      # 2 GB per-asset limit (2,147,483,648 bytes). Files that exceed this limit
      # cannot be attached to a release — doing so causes a fatal API error with
      # no useful recovery path. Instead of failing the whole job, we:
      #   1. Skip the oversized file from the staging directory (it is NOT uploaded).
      #   2. Record its name, size, and the direct workflow run URL in a sidecar
      #      file (/tmp/oversized_files.txt) so the release body step can include
      #      a prominent notice with a download link pointing back to this run's
      #      artifact (which always holds the full file regardless of size).
      #   3. Emit an Actions warning annotation so the file is flagged in the UI.
      # checksums.txt and metadata.json are always staged — they document every
      # file including the oversized ones.
      - name: Stage release files
        id: stage
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p /tmp/release_staging
          GITHUB_MAX_BYTES=2147483648   # GitHub's hard 2 GiB release-asset limit
          RUN_URL="${{ steps.meta.outputs.run_url }}"

          > /tmp/oversized_files.txt   # clear/create the sidecar

          while IFS= read -r FILENAME; do
            source_file="./$FILENAME"
            SIZE_BYTES=$(stat -c%s "$source_file")
            SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE_BYTES")

            if (( SIZE_BYTES > GITHUB_MAX_BYTES )); then
              echo "::warning::$FILENAME is $SIZE_HUMAN — exceeds GitHub's 2 GiB release-asset limit. It will NOT be attached to the release. Download it from the workflow artifact instead: $RUN_URL"
              printf '%s|%s|%s\n' "$FILENAME" "$SIZE_HUMAN" "$RUN_URL" >> /tmp/oversized_files.txt
            else
              cp "$source_file" "/tmp/release_staging/$FILENAME"
              echo "Staged: $FILENAME ($SIZE_HUMAN)"
            fi
          done < /tmp/filenames.txt

          cp checksums.txt /tmp/release_staging/
          cp metadata.json /tmp/release_staging/

          echo "Staged files:"
          ls -lh /tmp/release_staging/

      # ── 16. Upload Actions artifact ───────────────────────────────────────────
      # The artifact always contains ALL downloaded files (including oversized
      # ones that were excluded from the release). Users can download oversized
      # files from here via the link printed in the release body.
      - name: Upload artifact bundle
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: /tmp/release_staging/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      # ── 17. Build release body ────────────────────────────────────────────────
      # FIX: If any oversized files were recorded in /tmp/oversized_files.txt,
      # inject a clearly visible "⚠️ Files Excluded from Release" section at the
      # top of the release body. Each entry shows the filename, its size, and a
      # direct link to this workflow run where the full artifact can be downloaded.
      - name: Build release body
        id: body
        run: |
          BODY="/tmp/release_body.md"

          # ── Oversized-file notice (injected at the very top if needed) ────────
          if [ -s /tmp/oversized_files.txt ]; then
            cat >> "$BODY" <<'MDEOF'
          ## ⚠️ Files Excluded from This Release

          The following file(s) exceed GitHub's **2 GiB per-asset limit** and could
          not be attached directly to this release. They are available in the
          **GitHub Actions artifact** for this workflow run — click the link below
          each entry to go directly to the run page, then download the artifact bundle.

          | Filename | Size | Download |
          |---|---|---|
          MDEOF

            while IFS='|' read -r FNAME FSIZE FRUN_URL; do
              echo "| \`$FNAME\` | $FSIZE | [⬇️ Download from workflow artifact]($FRUN_URL) |" >> "$BODY"
            done < /tmp/oversized_files.txt

            echo "" >> "$BODY"
            echo "> The artifact bundle also contains \`checksums.txt\` and \`metadata.json\`." >> "$BODY"
            echo "" >> "$BODY"
            echo "---" >> "$BODY"
            echo "" >> "$BODY"
          fi

          # ── Per-file sections ─────────────────────────────────────────────────
          IDX=0
          while IFS= read -r URL; do
            IDX=$((IDX+1))
            source "/tmp/meta_${IDX}.env"
            SRC=$(cat "/tmp/source_type_${IDX}.txt")

            VT_RESULT="— (not checked)"
            [ -f "/tmp/vt_${IDX}.txt" ] && VT_RESULT=$(cat "/tmp/vt_${IDX}.txt")

            cat >> "$BODY" <<MDEOF
          ## 📦 File $IDX — \`$FILENAME\`

          | Field | Value |
          |---|---|
          | **Filename** | \`$FILENAME\` |
          | **MIME Type** | \`$MIME\` |
          | **Size** | $SIZE_HUMAN ($SIZE_BYTES bytes) |
          | **Source type** | $SRC |
          | **Downloaded at** | ${{ steps.meta.outputs.timestamp }} |
          | **Download speed** | $SPEED_HUMAN |

          ### 🔗 Source
          \`$URL\`

          ### 🔐 Checksums

          | Algorithm | Hash |
          |---|---|
          | **MD5** | \`$MD5\` |
          | **SHA-1** | \`$SHA1\` |
          | **SHA-256** | \`$SHA256\` |
          | **SHA-512** | \`$SHA512\` |

          ### 🛡️ VirusTotal
          $VT_RESULT

          MDEOF
          done < /tmp/urls.txt

          EXP_SHA256="${{ inputs.expected_sha256 }}"
          CLAMAV="${{ steps.clamav.outputs.scan_summary }}"

          cat >> "$BODY" <<MDEOF
          ---

          ## 🛡️ Security Summary

          | Check | Result |
          |---|---|
          | **SHA-256 integrity** | $( [ -n "$EXP_SHA256" ] && echo "✅ Verified" || echo "— (not provided)" ) |
          | **Antivirus (ClamAV)** | $CLAMAV |

          > \`checksums.txt\` and \`metadata.json\` are attached to this release.
          > Verify integrity with: \`sha256sum -c checksums.txt\`

          ---
          > _Released by @${{ github.actor }} — [View workflow run](${{ steps.meta.outputs.run_url }})_
          MDEOF

          echo "body_file=$BODY" >> "$GITHUB_OUTPUT"

      # ── 18. Create or append GitHub Release ──────────────────────────────────
      - name: Create or append Release
        id: release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    ${{ steps.tag.outputs.tag }}
          name:        ${{ inputs.release_name || steps.tag.outputs.tag }}
          prerelease:  ${{ inputs.prerelease }}
          draft:       ${{ inputs.draft }}
          append_body: ${{ inputs.append_to_existing }}
          body_path:   ${{ steps.body.outputs.body_file }}
          files:       /tmp/release_staging/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 19. Delete artifact after release (optional) ──────────────────────────
      - name: Delete artifact after release
        if: ${{ inputs.dry_run != true && inputs.delete_artifact_after_release == true }}
        uses: geekyeggo/delete-artifact@v5
        with:
          name: release-${{ steps.tag.outputs.tag }}
          failOnError: false

      # ── 20. Write job summary ─────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          DRY="${{ inputs.dry_run }}"
          TAG="${{ steps.tag.outputs.tag }}"
          RELEASE_URL="${{ steps.release.outputs.url }}"
          CL_HIT="${{ steps.clamav-cache.outputs.cache-hit }}"

          {
            [ "$DRY" = "true" ] && echo "# 🧪 Dry Run Summary" || echo "# ✅ Download & Release Summary"
            echo ""

            echo "## ⚡ Cache Status"
            echo "| Cache | Result |"
            echo "|---|---|"
            echo "| **ClamAV definitions** | $( [ "$CL_HIT" = "true" ] && echo "✅ Hit (freshclam skipped)" || echo "❌ Miss (freshclam ran)" ) |"
            echo ""

            # Oversized file notice in summary
            if [ -s /tmp/oversized_files.txt ]; then
              echo "## ⚠️ Oversized Files (excluded from release)"
              echo "| Filename | Size | Workflow Run |"
              echo "|---|---|---|"
              while IFS='|' read -r FNAME FSIZE FRUN_URL; do
                echo "| \`$FNAME\` | $FSIZE | [Download artifact]($FRUN_URL) |"
              done < /tmp/oversized_files.txt
              echo ""
            fi

            IDX=0
            while IFS= read -r URL; do
              IDX=$((IDX+1))
              [ -f "/tmp/meta_${IDX}.env" ] || continue
              source "/tmp/meta_${IDX}.env"
              SRC=$(cat "/tmp/source_type_${IDX}.txt" 2>/dev/null || echo "unknown")
              VT="— (not checked)"
              [ -f "/tmp/vt_${IDX}.txt" ] && VT=$(cat "/tmp/vt_${IDX}.txt")

              echo "## File $IDX: \`$FILENAME\`"
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| **MIME** | \`$MIME\` |"
              echo "| **Size** | $SIZE_HUMAN ($SIZE_BYTES bytes) |"
              echo "| **Source** | $SRC |"
              echo "| **Speed** | $SPEED_HUMAN |"
              echo "| **MD5** | \`$MD5\` |"
              echo "| **SHA-1** | \`$SHA1\` |"
              echo "| **SHA-256** | \`$SHA256\` |"
              echo "| **SHA-512** | \`$SHA512\` |"
              echo "| **URL** | \`$URL\` |"
              echo "| **VirusTotal** | $VT |"
              echo ""
            done < /tmp/urls.txt

            echo "## 🛡️ Security"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| **ClamAV** | ${{ steps.clamav.outputs.scan_summary }} |"
            echo ""

            if [ "$DRY" = "true" ]; then
              echo "## 🧪 Dry Run — Skipped Steps"
              echo "| Step | Status |"
              echo "|---|---|"
              echo "| Artifact upload | ⏭️ Skipped |"
              echo "| GitHub Release creation | ⏭️ Skipped |"
              echo "| Artifact deletion | ⏭️ Skipped |"
              echo "| Notifications (Discord/Slack/Telegram) | ⏭️ Skipped |"
              echo ""
              echo "_All download, validation, hash, and scan steps ran normally._"
            else
              echo "## 🚀 Release"
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| **Tag** | \`$TAG\` |"
              [ -n "$RELEASE_URL" ] && echo "| **Release URL** | $RELEASE_URL |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  FINAL SUMMARY"
          echo "════════════════════════════════════════════════════════"
          IDX=0
          while IFS= read -r URL; do
            IDX=$((IDX+1))
            [ -f "/tmp/meta_${IDX}.env" ] || continue
            source "/tmp/meta_${IDX}.env"
            printf "  %-12s %s\n"             "File $IDX:"  "$FILENAME"
            printf "  %-12s %s (%s bytes)\n"  "Size:"       "$SIZE_HUMAN" "$SIZE_BYTES"
            printf "  %-12s %s\n"             "MD5:"        "$MD5"
            printf "  %-12s %s\n"             "SHA-256:"    "$SHA256"
            printf "  %-12s %s\n"             "Speed:"      "$SPEED_HUMAN"
            echo   "  ────────────────────────────────────────────────────"
          done < /tmp/urls.txt
          [ "$DRY" != "true" ] && [ -n "$RELEASE_URL" ] && \
            printf "  %-12s %s\n" "Release:" "$RELEASE_URL"
          echo "════════════════════════════════════════════════════════"

      # ── 21. Write failure summary ─────────────────────────────────────────────
      - name: Write failure summary
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ---

          ## ❌ Workflow Failed

          | Possible cause | How to fix |
          |---|---|
          | URL returned non-2xx or unreachable | Verify the URL is publicly accessible |
          | Downloaded file was an HTML page | URL may need auth or redirects to a landing page |
          | File size exceeded limit | Raise `max_size_mb` or use a smaller source |
          | MIME type not in allowlist | Add the MIME type to `allowed_mimes` |
          | SHA-256 mismatch | Verify the expected hash matches the file |
          | Input validation error | Review the inputs listed above |
          | VirusTotal quota exceeded | Free tier is 4 req/min — reduce URL count or upgrade |
          | Torrent produced no files | Check the .torrent URL is valid and content is available |

          Check the individual step logs above for the exact error message.
          EOF

      # ── 22. Discord notification ──────────────────────────────────────────────
      - name: Notify Discord
        if: ${{ inputs.dry_run != true && env.HAS_DISCORD == 'true' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          with open('/tmp/filenames.txt') as f:
              filenames = [l.strip() for l in f if l.strip()]

          # Note oversized files in the Discord embed
          oversized = {}
          if os.path.exists('/tmp/oversized_files.txt'):
              for line in open('/tmp/oversized_files.txt').read().strip().splitlines():
                  parts = line.split('|')
                  if len(parts) == 3:
                      oversized[parts[0]] = parts[1]

          fields = []
          for i, fn in enumerate(filenames):
              label = f"File {i+1}"
              value = f"`{fn}`"
              if fn in oversized:
                  value += f"\n⚠️ {oversized[fn]} — too large for release, see artifact"
              fields.append({"name": label, "value": value, "inline": True})

          fields += [
              {"name": "Release", "value": os.environ.get("RELEASE_URL", "—"), "inline": False},
              {"name": "ClamAV",  "value": os.environ.get("CLAMAV", "—"),      "inline": True},
          ]

          payload = {"embeds": [{
              "title":  f"📦 New Release: {os.environ['TAG']}",
              "url":    os.environ.get("RELEASE_URL", ""),
              "color":  5763719,
              "fields": fields,
              "footer": {"text": f"GitHub Actions • {os.environ['REPO']}"}
          }]}

          try:
              req = urllib.request.Request(
                  os.environ["DISCORD_WEBHOOK"],
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              urllib.request.urlopen(req)
              print("Discord notification sent.")
          except Exception as e:
              print(f"::warning::Discord notification failed: {e}")
          PYEOF
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG:             ${{ steps.tag.outputs.tag }}
          RELEASE_URL:     ${{ steps.release.outputs.url }}
          CLAMAV:          ${{ steps.clamav.outputs.scan_summary }}
          REPO:            ${{ github.repository }}

      # ── 23. Slack notification ────────────────────────────────────────────────
      - name: Notify Slack
        if: ${{ inputs.dry_run != true && env.HAS_SLACK == 'true' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          with open('/tmp/filenames.txt') as f:
              filenames = [l.strip() for l in f if l.strip()]

          oversized = {}
          if os.path.exists('/tmp/oversized_files.txt'):
              for line in open('/tmp/oversized_files.txt').read().strip().splitlines():
                  parts = line.split('|')
                  if len(parts) == 3:
                      oversized[parts[0]] = (parts[1], parts[2])

          file_lines = []
          for fn in filenames:
              if fn in oversized:
                  size, run_url = oversized[fn]
                  file_lines.append(f"• `{fn}` ⚠️ {size} — <{run_url}|download from artifact>")
              else:
                  file_lines.append(f"• `{fn}`")
          file_list = "\n".join(file_lines)

          payload = {"blocks": [
              {"type": "header",
               "text": {"type": "plain_text",
                        "text": f"📦 New Release: {os.environ['TAG']}"}},
              {"type": "section",
               "fields": [
                   {"type": "mrkdwn", "text": f"*Files:*\n{file_list}"},
                   {"type": "mrkdwn", "text": f"*ClamAV:*\n{os.environ.get('CLAMAV','—')}"},
                   {"type": "mrkdwn", "text": f"*Repo:*\n{os.environ.get('REPO')}"},
               ]},
              {"type": "actions", "elements": [{
                  "type": "button",
                  "text": {"type": "plain_text", "text": "View Release"},
                  "url":  os.environ.get("RELEASE_URL", "")
              }]}
          ]}

          try:
              req = urllib.request.Request(
                  os.environ["SLACK_WEBHOOK"],
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              urllib.request.urlopen(req)
              print("Slack notification sent.")
          except Exception as e:
              print(f"::warning::Slack notification failed: {e}")
          PYEOF
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          TAG:           ${{ steps.tag.outputs.tag }}
          RELEASE_URL:   ${{ steps.release.outputs.url }}
          CLAMAV:        ${{ steps.clamav.outputs.scan_summary }}
          REPO:          ${{ github.repository }}

      # ── 24. Telegram notification ─────────────────────────────────────────────
      - name: Notify Telegram
        if: ${{ inputs.dry_run != true && env.HAS_TELEGRAM == 'true' && inputs.telegram_chat_id != '' }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse

          with open('/tmp/filenames.txt') as f:
              filenames = [l.strip() for l in f if l.strip()]

          oversized = {}
          if os.path.exists('/tmp/oversized_files.txt'):
              for line in open('/tmp/oversized_files.txt').read().strip().splitlines():
                  parts = line.split('|')
                  if len(parts) == 3:
                      oversized[parts[0]] = (parts[1], parts[2])

          def html_escape(s):
              """Escape the five XML/HTML special chars Telegram HTML mode requires."""
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;").replace("'", "&#39;")

          file_lines = []
          for fn in filenames:
              if fn in oversized:
                  size, run_url = oversized[fn]
                  file_lines.append(
                      f"  • <code>{html_escape(fn)}</code> ⚠️ {html_escape(size)} — "
                      f"too large, <a href=\"{html_escape(run_url)}\">download from artifact</a>"
                  )
              else:
                  file_lines.append(f"  • <code>{html_escape(fn)}</code>")
          file_list = "\n".join(file_lines)

          # Fix 1A: Use parse_mode=HTML — the legacy Markdown parser breaks on
          # underscores/asterisks inside filenames (e.g. my_app_v1.0.zip → 400 error).
          # HTML mode is Telegram's recommended replacement and is safely escaped above.
          text = (
              f"<b>📦 New Release: {html_escape(os.environ['TAG'])}</b>\n"
              f"Files:\n{file_list}\n"
              f"ClamAV: {html_escape(os.environ.get('CLAMAV','—'))}\n"
              f"<a href=\"{html_escape(os.environ.get('RELEASE_URL',''))}\">View Release</a>"
          )

          try:
              params = urllib.parse.urlencode({
                  "chat_id":    os.environ["TELEGRAM_CHAT_ID"],
                  "text":       text,
                  "parse_mode": "HTML"
              })
              urllib.request.urlopen(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage?{params}"
              )
              print("Telegram notification sent.")
          except Exception as e:
              print(f"::warning::Telegram notification failed: {e}")
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ inputs.telegram_chat_id }}
          TAG:                ${{ steps.tag.outputs.tag }}
          RELEASE_URL:        ${{ steps.release.outputs.url }}
          CLAMAV:             ${{ steps.clamav.outputs.scan_summary }}
