name: Update Typosquatting Blocklist

on:
  # Run on a schedule (every Sunday at 02:00 UTC)
  schedule:
    - cron: "0 2 * * 0"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Run whenever the allowed-domains list changes
  push:
    paths:
      - "allowed-domains.txt"

permissions:
  contents: write

jobs:
  generate-blocklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install URLCrazy ────────────────────────────────────────────────────
      - name: Install URLCrazy
        run: |
          sudo apt-get install -y ruby ruby-dev ruby-async ruby-async-http ruby-colorize dnsutils
          git clone --depth 1 https://github.com/urbanadventurer/urlcrazy.git /opt/urlcrazy

          # async-dns is not packaged in apt. URLCrazy already has a full Resolv
          # fallback built in — patch it to skip the async/dns require and resolver.
          python3 <<'PYEOF'
          with open('/opt/urlcrazy/urlcrazy', 'r') as f:
              src = f.read()
          src = src.replace("  require 'async/dns'\n", "")
          with open('/opt/urlcrazy/urlcrazy', 'w') as f:
              f.write(src)

          with open('/opt/urlcrazy/lib/typo.rb', 'r') as f:
              src = f.read()
          src = src.replace(
              "@@resolver = Async::DNS::Resolver.new(ASYNC_DNS_SERVERS, timeout: 60)",
              "@@resolver = nil # async-dns unavailable; Resolv fallback used instead"
          )
          with open('/opt/urlcrazy/lib/typo.rb', 'w') as f:
              f.write(src)
          print("URLCrazy patched OK")
          PYEOF

          # Wrapper script instead of symlink — urlcrazy uses relative requires
          # so it must be executed from its own directory
          sudo tee /usr/local/bin/urlcrazy > /dev/null <<'EOF'
          #!/usr/bin/env bash
          export RUBYOPT="-E UTF-8"
          exec ruby /opt/urlcrazy/urlcrazy "$@"
          EOF
          sudo chmod +x /usr/local/bin/urlcrazy

      # ── Generate variants ───────────────────────────────────────────────────
      - name: Generate typo variants and filter
        run: |
          set -euo pipefail

          ALLOWED_FILE="allowed-domains.txt"
          BLOCKLIST_FILE="blocklist.txt"
          SCRATCH=$(mktemp -d)
          RAW="$SCRATCH/raw.txt"
          RESOLVED="$SCRATCH/resolved.txt"

          echo "==> Reading allowed domains from $ALLOWED_FILE"

          # Strip comments and blank lines to build the allowed set
          mapfile -t ALLOWED < <(grep -v '^\s*#' "$ALLOWED_FILE" | grep -v '^\s*$' | tr '[:upper:]' '[:lower:]')

          if [ ${#ALLOWED[@]} -eq 0 ]; then
            echo "No domains found in $ALLOWED_FILE — nothing to do."
            exit 0
          fi

          echo "==> Running URLCrazy on ${#ALLOWED[@]} domain(s)..."

          touch "$RAW"
          for domain in "${ALLOWED[@]}"; do
            echo "  Processing: $domain"
            # -f csv  → machine-readable CSV output
            # Omit -r so ALL variants are generated (not just resolved ones)
            # CSV format: "Typo Type","Typo","Valid","Pop","DNS-A",...
            #   - row 1 is blank, row 2 is header → skip first 2 rows (tail -n +3)
            #   - field 2 is the typo domain, values are quoted → strip with tr -d '"'
            RUBYOPT="-E UTF-8" urlcrazy -f csv "$domain" 2>/dev/null \
              | tail -n +3 \
              | cut -d',' -f2 \
              | tr -d '"' \
              | tr '[:upper:]' '[:lower:]' \
              | grep -E '^[a-z0-9][a-z0-9.\-]+\.[a-z]{2,}$' \
              >> "$RAW" || true
          done

          echo "==> Raw variants generated: $(wc -l < "$RAW")"

          # ── DNS filter: keep only variants that actually resolve ─────────────
          echo "==> Checking DNS resolution..."
          while IFS= read -r variant; do
            if host -t A "$variant" >/dev/null 2>&1 || \
               host -t MX "$variant" >/dev/null 2>&1; then
              echo "$variant"
            fi
          done < "$RAW" > "$RESOLVED"

          echo "==> Variants that resolve: $(wc -l < "$RESOLVED")"

          # ── Allowed-list filter: remove any domain in the allowed list ───────
          PATTERN=$(printf '%s\n' "${ALLOWED[@]}" | sed 's/\./\\./g' | paste -sd'|')

          grep -Evx "($PATTERN)" "$RESOLVED" \
            | sort -u \
            > "$BLOCKLIST_FILE" || true

          echo "==> Final blocklist size: $(wc -l < "$BLOCKLIST_FILE")"

      # ── Commit result back to repo ──────────────────────────────────────────
      - name: Commit updated blocklist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add blocklist.txt

          if git diff --cached --quiet; then
            echo "No changes to blocklist — skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            DOMAIN_COUNT=$(grep -v '^\s*#' allowed-domains.txt | grep -v '^\s*$' | wc -l)
            BLOCK_COUNT=$(wc -l < blocklist.txt)

            git commit -m "chore: update typosquatting blocklist [${TIMESTAMP}]" \
              -m "Source domains: ${DOMAIN_COUNT}" \
              -m "Blocked variants: ${BLOCK_COUNT}" \
              -m "Filters applied: DNS resolution, allowed-list exclusion"

            git push
          fi
