name: Build Android App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build Debug APK (Fast, good for checking if PRs break the build)
      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Only build Release AAB on Main branch to save time/resources
      - name: Build Android Release Bundle
        if: github.ref == 'refs/heads/main'
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Export build logs
        if: always()
        run: |
          echo "=== Build Summary ===" > build-log.txt
          echo "Branch: ${{ github.ref_name }}" >> build-log.txt
          echo "Status: ${{ job.status }}" >> build-log.txt
          find . -name "*.apk" -type f >> build-log.txt
          find . -name "*.aab" -type f >> build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # Using wildcards helps if the module name isn't "app"
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Upload AAB (Release)
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: "**/build/outputs/bundle/release/*.aab"
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-log.txt
