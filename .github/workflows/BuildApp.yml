name: Build Android App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Clone the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up JDK (required for Android/Kotlin development)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      # Step 3: Make gradlew executable (installing/preparing gradlew)
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      # Step 4: Build the Android app
      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace
      
      # Step 5: Build Android App Bundle (optional, for release)
      - name: Build Android App Bundle
        run: ./gradlew bundleRelease --stacktrace
        continue-on-error: true
      
      # Step 6: Export build logs
      - name: Export build logs
        if: always()
        run: |
          echo "=== Build Summary ===" | tee build-log.txt
          echo "Workflow: ${{ github.workflow }}" | tee -a build-log.txt
          echo "Run Number: ${{ github.run_number }}" | tee -a build-log.txt
          echo "Run ID: ${{ github.run_id }}" | tee -a build-log.txt
          echo "Repository: ${{ github.repository }}" | tee -a build-log.txt
          echo "Branch: ${{ github.ref_name }}" | tee -a build-log.txt
          echo "Commit: ${{ github.sha }}" | tee -a build-log.txt
          echo "Actor: ${{ github.actor }}" | tee -a build-log.txt
          echo "Build Status: ${{ job.status }}" | tee -a build-log.txt
          echo "" | tee -a build-log.txt
          echo "=== APK Files ===" | tee -a build-log.txt
          find . -name "*.apk" -type f | tee -a build-log.txt
          echo "" | tee -a build-log.txt
          echo "=== AAB Files ===" | tee -a build-log.txt
          find . -name "*.aab" -type f | tee -a build-log.txt
      
      # Step 7: Upload build artifacts (APK)
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      # Step 8: Upload build logs as artifact
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-log.txt
          retention-days: 30
      
      # Step 9: Display log summary in workflow output
      - name: Display build summary
        if: always()
        run: cat build-log.txt
