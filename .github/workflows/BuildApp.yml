name: Build External Android Repo

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub Repository URL or "owner/repo" (e.g., https://github.com/google/iosched or google/iosched)'
        required: true
        default: 'owner/repo'
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'main'
      java_version:
        description: 'Java Version (11, 17, 21)'
        required: true
        default: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Extract the repository name from the URL if a full URL was provided
      - name: Parse Repository Name
        id: repo-parse
        run: |
          # This converts "https://github.com/owner/repo" into "owner/repo"
          CLEAN_REPO=$(echo "${{ github.event.inputs.repo_url }}" | sed 's|https://github.com/||' | sed 's|/+$||')
          echo "target_repo=$CLEAN_REPO" >> $GITHUB_OUTPUT

      # Step 2: Clone the EXTERNAL repository
      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo-parse.outputs.target_repo }}
          ref: ${{ github.event.inputs.branch }}

      # Step 3: Set up JDK (using input version)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version }}
          distribution: 'temurin'
          cache: 'gradle'

      # Step 4: Check if gradlew exists and make executable
      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Error: gradlew not found in the root of the repository."
            exit 1
          fi

      # Step 5: Build the Android app
      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 6: Upload build artifacts (APK)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
