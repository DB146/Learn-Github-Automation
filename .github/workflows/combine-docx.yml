name: Download, Extract & Combine DOCX

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Direct download URL for the ZIP file"
        required: true
        type: string

jobs:
  process-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Download the ZIP file ─────────────────────────────────────────────
      - name: Download ZIP file
        run: |
          echo "Downloading from ${{ inputs.download_url }}..."
          curl -L --fail --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o source.zip "${{ inputs.download_url }}"

      # ── 2. Extract the ZIP file ──────────────────────────────────────────────
      - name: Extract ZIP file
        run: |
          mkdir extracted
          unzip source.zip -d extracted/
          echo "Extraction complete. Found files:"
          find extracted/ -type f

      # ── 3. Set up Python for Document combination ────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install python-docx docxcompose

      # ── 4. Combine DOCX files via Python script ──────────────────────────────
      - name: Combine DOCX files
        run: |
          python3 - <<'EOF'
          import sys
          import glob
          import os
          from docxcompose.composer import Composer
          from docx import Document

          # Find all .docx files recursively in the 'extracted' directory
          docx_files = glob.glob('extracted/**/*.docx', recursive=True)

          # Filter out temporary/hidden files (like ~$filename.docx)
          docx_files = [f for f in docx_files if not os.path.basename(f).startswith('~$')]

          if not docx_files:
              print("::error::No .docx files found in the extracted ZIP!")
              sys.exit(1)

          # Sort files alphabetically so they merge in order
          docx_files.sort()

          print(f"Found {len(docx_files)} DOCX file(s):")
          for f in docx_files:
              print(f" - {f}")

          try:
              # Use the first file as the base document
              master = Document(docx_files[0])
              composer = Composer(master)

              # Append all subsequent documents
              for f in docx_files[1:]:
                  print(f"Appending {f}...")
                  doc = Document(f)
                  composer.append(doc)

              # Save the final combined document
              composer.save('combined_document.docx')
              print("Successfully combined into 'combined_document.docx'")
              
          except Exception as e:
              print(f"::error::Failed to combine documents: {e}")
              sys.exit(1)
          EOF

      # ── 5. Upload Artifact ───────────────────────────────────────────────────
      - name: Upload Combined DOCX
        uses: actions/upload-artifact@v4
        with:
          name: Combined-DOCX-File
          path: combined_document.docx
          retention-days: 7
          if-no-files-found: error
